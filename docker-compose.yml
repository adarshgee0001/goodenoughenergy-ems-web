services:
  postgres:
    image: postgres:17-alpine
    container_name: ems-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-EmsDev2026!Pg}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
    volumes:
      - ems_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ems}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-EmsDev2026!Pg}@postgres:5432/${POSTGRES_DB:-ems}?schema=public
      JWT_SECRET: ${JWT_SECRET:-90b68a2bc0a3ed38586290da5cc0de6b9c13dccd6e8fc92621bbd5ab0fa73eb5}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:5173,http://localhost:3000,http://localhost:80
      DB_HOST: postgres
      DB_PORT: 5432
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gee.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin@321}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtts://a78dc6627ffa4d10a67ad441b415f980.s1.eu.hivemq.cloud}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_USERNAME: ${MQTT_USERNAME:-adarshyadav}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-@adarsh!!}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-ems_backend_telemetry_a}
      MQTT_PROTOCOL: ${MQTT_PROTOCOL:-mqtts}
      MQTT_TOPIC: ${MQTT_TOPIC:-/adarsh07786/0QQSB03PY21106F680100007/user/rtg}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: ems-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ems_postgres_data:
    name: ems_postgres_data
