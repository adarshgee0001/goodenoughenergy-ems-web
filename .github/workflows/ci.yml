name: CI Pipeline

on:
  push:
    branches: [ main, master, staging, debug_deploy ]
  pull_request:
    branches: [ main, master, staging, debug_deploy ]

jobs:
  backend-ci:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: EmsDev2026!Pg
          POSTGRES_DB: ems
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend - Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Backend - Test Database Migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:EmsDev2026!Pg@localhost:5432/ems?schema=public
        run: npx prisma migrate deploy

      - name: Backend - Test Admin Seeding
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:EmsDev2026!Pg@localhost:5432/ems?schema=public
          ADMIN_NAME: Test Admin
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: TestPassword123!
        run: npx tsx prisma/seed.ts

      - name: Backend - Run Unit Tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:EmsDev2026!Pg@localhost:5432/ems?schema=public
        run: npm run test:unit

      - name: Backend - Build
        working-directory: ./backend
        run: npm run build

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Run Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend - Build
        working-directory: ./frontend
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build
